[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caisen"
version = "0.1.0"
description = "量化回测系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pandas",
    "pyarrow",
    "click",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "vitest>=1.0.0",
]

[tool.vitest]
testDirectory = "tests/js"

[tool.hatch.build.targets.wheel]
packages = ["src/caisen"]

# Frontend JS files to include in package
[tool.hatch.build.targets.wheel.force-include]
"src/caisen/visualization/js/" = "caisen/visualization/js/"