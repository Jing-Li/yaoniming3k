<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回测详情 - 策微 CeWei</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='/'">
                    ← 返回列表
                </button>
                <h1>回测详情</h1>
            </div>
            <div class="header-info" id="header-info">
                <span><span class="label">策略:</span> <span id="strategy-name">-</span></span>
                <span><span class="label">标的:</span> <span id="symbol">-</span></span>
                <span><span class="label">周期:</span> <span id="freq">-</span></span>
                <span><span class="label">时间:</span> <span id="date-range">-</span></span>
            </div>
        </div>

        <!-- Metrics Panel -->
        <div class="metrics-panel" id="metrics-panel">
            <div class="metric-card metric-card-feature">
                <div class="label">总收益率</div>
                <div class="value metric-value-large" id="total-return">-</div>
                <div id="sparkline-container" style="width:100%;height:40px;margin-top:var(--spacing-sm,8px);"></div>
            </div>
            <div class="metric-card">
                <div class="label">年化收益率</div>
                <div class="value" id="annual-return">-</div>
            </div>
            <div class="metric-card">
                <div class="label">最大回撤</div>
                <div class="value negative" id="max-drawdown">-</div>
            </div>
            <div class="metric-card">
                <div class="label">夏普比率</div>
                <div class="value neutral" id="sharpe-ratio">-</div>
            </div>
            <div class="metric-card">
                <div class="label">胜率</div>
                <div class="value" id="win-rate">-</div>
            </div>
            <div class="metric-card">
                <div class="label">盈亏比</div>
                <div class="value" id="profit-factor">-</div>
            </div>
            <div class="metric-card">
                <div class="label">交易次数</div>
                <div class="value neutral" id="total-trades">-</div>
            </div>
        </div>

        <!-- K-Line Chart -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>K线走势</h2>
                <div class="chart-controls">
                    <div class="date-filter">
                        <label>从</label>
                        <input type="date" id="start-date">
                        <label>到</label>
                        <input type="date" id="end-date">
                        <button onclick="applyDateFilter()">筛选</button>
                    </div>
                    <button id="btn-zoom" onclick="toggleZoom()">缩放</button>
                    <button onclick="resetZoom()">重置</button>
                </div>
            </div>
            <!-- Annotation Filter Panel -->
            <div id="annotation-filter-panel" class="annotation-filter-panel collapsed"></div>
            <div class="chart-wrapper" id="kline-chart"></div>
            <div class="pattern-legend" id="pattern-legend"></div>
        </div>

        <!-- Equity Curve -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>净值曲线</h2>
                <div class="chart-controls">
                    <button onclick="toggleEquity()">隐藏/显示</button>
                </div>
            </div>
            <div class="chart-wrapper equity-chart" id="equity-chart"></div>
        </div>

        <!-- Drawdown Chart -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>回撤分析</h2>
            </div>
            <div class="chart-wrapper drawdown-chart" id="drawdown-chart"></div>
        </div>

        <!-- Monthly Returns Heatmap -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>月度收益</h2>
            </div>
            <div class="chart-wrapper heatmap-chart" id="heatmap-chart"></div>
        </div>

        <!-- Trade Distribution -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>盈亏分布</h2>
            </div>
            <div class="chart-wrapper trade-distribution-chart" id="trade-distribution-chart"></div>
        </div>

        <!-- Trades Table -->
        <div class="trades-panel">
            <div class="trades-header" style="display:flex;justify-content:space-between;align-items:center;gap:var(--spacing-md);flex-wrap:wrap;margin-bottom:var(--spacing-md);">
                <h2 style="margin:0;border:none;padding:0;">交易记录</h2>
                <div id="trades-summary" class="trades-summary" style="display:flex;gap:var(--spacing-lg);font-size:var(--font-size-xs);color:var(--text-muted);"></div>
            </div>
            <table class="trades-table">
                <thead>
                    <tr id="trades-thead-row">
                        <th class="sortable" data-sort-key="timestamp">时间<span class="sort-icon"></span></th>
                        <th>方向</th>
                        <th class="sortable" data-sort-key="price">价格<span class="sort-icon"></span></th>
                        <th class="sortable" data-sort-key="quantity">数量<span class="sort-icon"></span></th>
                        <th class="sortable" data-sort-key="commission">手续费<span class="sort-icon"></span></th>
                        <th>盈亏</th>
                    </tr>
                </thead>
                <tbody id="trades-body">
                </tbody>
            </table>
            <div class="pagination" id="trades-pagination" style="display:flex;justify-content:center;align-items:center;gap:var(--spacing-xs,4px);margin-top:var(--spacing-md,16px);flex-wrap:wrap;"></div>
        </div>
    </div>

    <script type="module">
        import '/js/main.js';
    </script>
</body>
</html>
