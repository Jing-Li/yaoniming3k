<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisen 回测可视化</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border-bottom: 1px solid #2d3748;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #60a5fa;
        }

        .header-info {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: #a0aec0;
        }

        .header-info span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-info .label {
            color: #718096;
        }

        /* Metrics Panel */
        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: linear-gradient(135deg, #1e2a4a 0%, #16213e 100%);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2d3748;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .metric-card .label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .metric-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #e2e8f0;
        }

        .metric-card .value.positive {
            color: #48bb78;
        }

        .metric-card .value.negative {
            color: #fc8181;
        }

        .metric-card .value.neutral {
            color: #60a5fa;
        }

        /* Chart Container */
        .chart-container {
            background: linear-gradient(135deg, #1e2a4a 0%, #16213e 100%);
            border-radius: 12px;
            border: 1px solid #2d3748;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .chart-header {
            padding: 16px 24px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .chart-controls {
            display: flex;
            gap: 12px;
        }

        .chart-controls button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #4a5568;
            background: #2d3748;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .chart-controls button:hover {
            background: #4a5568;
            border-color: #60a5fa;
        }

        .chart-controls button.active {
            background: #3182ce;
            border-color: #60a5fa;
        }

        .chart-wrapper {
            height: 500px;
            padding: 16px;
        }

        /* Equity Chart */
        .equity-chart {
            height: 200px;
        }

        /* Pattern Legend */
        .pattern-legend {
            padding: 16px 24px;
            border-top: 1px solid #2d3748;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0aec0;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            border-radius: 2px;
        }

        /* Trades Table */
        .trades-panel {
            background: linear-gradient(135deg, #1e2a4a 0%, #16213e 100%);
            border-radius: 12px;
            border: 1px solid #2d3748;
            overflow: hidden;
        }

        .trades-panel h2 {
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            border-bottom: 1px solid #2d3748;
        }

        .trades-table {
            width: 100%;
            border-collapse: collapse;
        }

        .trades-table th,
        .trades-table td {
            padding: 12px 24px;
            text-align: left;
            border-bottom: 1px solid #2d3748;
        }

        .trades-table th {
            background: #1a1f36;
            font-size: 12px;
            font-weight: 600;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trades-table td {
            font-size: 14px;
            color: #e2e8f0;
        }

        .trades-table tr:hover {
            background: #2d3748;
        }

        .side-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .side-badge.buy {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }

        .side-badge.sell {
            background: rgba(252, 129, 129, 0.2);
            color: #fc8181;
        }

        /* Loading & Error States */
        .loading,
        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 16px;
        }

        .loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #2d3748;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #fc8181;
        }

        .error-icon {
            font-size: 48px;
        }

        .error button {
            padding: 12px 24px;
            background: #3182ce;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        /* Date Filter */
        .date-filter {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .date-filter label {
            font-size: 13px;
            color: #718096;
        }

        .date-filter input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4a5568;
            background: #2d3748;
            color: #e2e8f0;
            font-size: 13px;
        }

        .date-filter input:focus {
            outline: none;
            border-color: #60a5fa;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-info {
                flex-wrap: wrap;
                justify-content: center;
            }

            .metrics-panel {
                grid-template-columns: repeat(2, 1fr);
            }

            .chart-wrapper {
                height: 350px;
            }

            .trades-table {
                font-size: 12px;
            }

            .trades-table th,
            .trades-table td {
                padding: 8px 12px;
            }
        }

        /* Tooltip override */
        .echarts-tooltip {
            background: #1a1f36 !important;
            border: 1px solid #4a5568 !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Caisen 回测可视化</h1>
            <div class="header-info" id="header-info">
                <span><span class="label">策略:</span> <span id="strategy-name">-</span></span>
                <span><span class="label">标的:</span> <span id="symbol">-</span></span>
                <span><span class="label">周期:</span> <span id="freq">-</span></span>
                <span><span class="label">时间:</span> <span id="date-range">-</span></span>
            </div>
        </div>

        <!-- Metrics Panel -->
        <div class="metrics-panel" id="metrics-panel">
            <div class="metric-card">
                <div class="label">总收益率</div>
                <div class="value" id="total-return">-</div>
            </div>
            <div class="metric-card">
                <div class="label">年化收益率</div>
                <div class="value" id="annual-return">-</div>
            </div>
            <div class="metric-card">
                <div class="label">最大回撤</div>
                <div class="value negative" id="max-drawdown">-</div>
            </div>
            <div class="metric-card">
                <div class="label">夏普比率</div>
                <div class="value neutral" id="sharpe-ratio">-</div>
            </div>
            <div class="metric-card">
                <div class="label">胜率</div>
                <div class="value" id="win-rate">-</div>
            </div>
            <div class="metric-card">
                <div class="label">盈亏比</div>
                <div class="value" id="profit-factor">-</div>
            </div>
            <div class="metric-card">
                <div class="label">交易次数</div>
                <div class="value neutral" id="total-trades">-</div>
            </div>
        </div>

        <!-- K-Line Chart -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>K线走势</h2>
                <div class="chart-controls">
                    <div class="date-filter">
                        <label>从</label>
                        <input type="date" id="start-date">
                        <label>到</label>
                        <input type="date" id="end-date">
                        <button onclick="applyDateFilter()">筛选</button>
                    </div>
                    <button id="btn-zoom" onclick="toggleZoom()">缩放</button>
                    <button id="btn-reset" onclick="resetZoom()">重置</button>
                </div>
            </div>
            <div class="chart-wrapper" id="kline-chart"></div>
            <div class="pattern-legend" id="pattern-legend"></div>
        </div>

        <!-- Equity Curve -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>净值曲线</h2>
                <div class="chart-controls">
                    <button onclick="toggleEquity()">隐藏/显示</button>
                </div>
            </div>
            <div class="chart-wrapper equity-chart" id="equity-chart"></div>
        </div>

        <!-- Trades Table -->
        <div class="trades-panel">
            <h2>交易记录</h2>
            <table class="trades-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>方向</th>
                        <th>价格</th>
                        <th>数量</th>
                        <th>手续费</th>
                    </tr>
                </thead>
                <tbody id="trades-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Global state
        let chart = null;
        let equityChart = null;
        let rawData = null;
        let filteredData = null;
        let isZoomEnabled = false;
        let isEquityVisible = true;

        // Pattern colors
        const PATTERN_COLORS = {
            head_and_shoulders_bottom: '#9f7aea',
            head_and_shoulders_top: '#ed8936',
            w_bottom: '#48bb78',
            m_top: '#fc8181',
            triangle_ascending: '#60a5fa',
            triangle_descending: '#f6ad55',
            flag: '#f687b3',
            double_top: '#b794f4',
            double_bottom: '#68d391'
        };

        // Get data URL from query params
        function getDataUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('data') || './data.json';
        }

        // Load data
        async function loadData() {
            try {
                const url = getDataUrl();
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                rawData = await response.json();
                filteredData = JSON.parse(JSON.stringify(rawData));
                renderAll();
            } catch (error) {
                showError(error.message);
            }
        }

        // Show error
        function showError(message) {
            document.querySelector('.container').innerHTML = `
                <div class="error">
                    <div class="error-icon">!</div>
                    <div>加载数据失败</div>
                    <div style="font-size: 14px; color: #718096;">${message}</div>
                    <button onclick="location.reload()">重试</button>
                </div>
            `;
        }

        // Format value
        function formatValue(value, type = 'percent') {
            if (value === null || value === undefined || isNaN(value)) return '-';
            if (type === 'percent') {
                return (value * 100).toFixed(2) + '%';
            } else if (type === 'currency') {
                return value.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else if (type === 'ratio') {
                if (!isFinite(value)) return '∞';
                return value.toFixed(2);
            }
            return value.toFixed(2);
        }

        // Format timestamp
        function formatTimestamp(ts) {
            const date = new Date(ts);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Render all
        function renderAll() {
            renderHeader();
            renderMetrics();
            renderKLineChart();
            renderEquityChart();
            renderTradesTable();
            renderPatternLegend();
            initDateInputs();
        }

        // Render header
        function renderHeader() {
            const { meta } = rawData;
            document.getElementById('strategy-name').textContent = meta.strategy_name || '-';
            document.getElementById('symbol').textContent = meta.symbol || '-';
            document.getElementById('freq').textContent = meta.freq || '-';
            document.getElementById('date-range').textContent = `${meta.start} ~ ${meta.end}`;
        }

        // Calculate annual return
        function calculateAnnualReturn() {
            if (!rawData || !rawData.equity_curve || rawData.equity_curve.length < 2) return 0;
            const equity = rawData.equity_curve;
            const initial = equity[0].equity;
            const final = equity[equity.length - 1].equity;
            if (initial <= 0) return 0;

            // Estimate days based on data frequency
            const days = equity.length;
            const years = days / (meta.freq === '1h' ? 250 * 24 : meta.freq === '5m' ? 250 * 48 : 250);

            return Math.pow(final / initial, 1 / years) - 1;
        }

        // Render metrics
        function renderMetrics() {
            const { metrics } = rawData;
            const annualReturn = calculateAnnualReturn();

            const totalReturn = document.getElementById('total-return');
            const annualReturnEl = document.getElementById('annual-return');
            const maxDrawdown = document.getElementById('max-drawdown');
            const sharpeRatio = document.getElementById('sharpe-ratio');
            const winRate = document.getElementById('win-rate');
            const profitFactor = document.getElementById('profit-factor');
            const totalTrades = document.getElementById('total-trades');

            totalReturn.textContent = formatValue(metrics.total_return);
            totalReturn.className = 'value ' + (metrics.total_return >= 0 ? 'positive' : 'negative');

            annualReturnEl.textContent = formatValue(annualReturn);
            annualReturnEl.className = 'value ' + (annualReturn >= 0 ? 'positive' : 'negative');

            maxDrawdown.textContent = formatValue(metrics.max_drawdown);

            sharpeRatio.textContent = formatValue(metrics.sharpe_ratio, 'ratio');
            sharpeRatio.className = 'value ' + (metrics.sharpe_ratio > 0 ? 'positive' : metrics.sharpe_ratio < 0 ? 'negative' : 'neutral');

            winRate.textContent = formatValue(metrics.win_rate);
            winRate.className = 'value ' + (metrics.win_rate >= 0.5 ? 'positive' : 'negative');

            profitFactor.textContent = formatValue(metrics.profit_factor, 'ratio');
            profitFactor.className = 'value ' + (metrics.profit_factor >= 1 ? 'positive' : 'negative');

            totalTrades.textContent = metrics.total_trades || rawData.trades?.length || 0;
        }

        // Get filtered data
        function getFilteredData() {
            return filteredData;
        }

        // Render K-Line chart
        function renderKLineChart() {
            const data = getFilteredData();
            if (!data || !data.bars || data.bars.length === 0) return;

            // Prepare K-line data
            const dates = data.bars.map(bar => new Date(bar.timestamp).toLocaleString('zh-CN', {
                month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
            }));
            const klineData = data.bars.map(bar => [bar.open, bar.close, bar.low, bar.high]);
            const volumes = data.bars.map(bar => bar.volume);

            // Collect all annotations
            const markPoints = [];
            const markLines = [];

            if (data.annotations) {
                data.annotations.forEach(annotation => {
                    const renderFn = renderMap[annotation.type];
                    if (renderFn) {
                        renderFn({ markPoints, markLines }, annotation, data.bars);
                    }
                });
            }

            // Trades markers
            if (data.trades) {
                data.trades.forEach(trade => {
                    const bar = data.bars.find(b => b.timestamp === trade.timestamp ||
                        Math.abs(new Date(b.timestamp) - new Date(trade.timestamp)) < 3600000);
                    if (bar) {
                        markPoints.push({
                            coord: [data.bars.indexOf(bar), bar.close],
                            value: trade.side === 'BUY' ? '买入' : '卖出',
                            symbol: 'circle',
                            symbolSize: 12,
                            itemStyle: { color: trade.side === 'BUY' ? '#48bb78' : '#fc8181' }
                        });
                    }
                });
            }

            // Chart options
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    backgroundColor: '#1a1f36',
                    borderColor: '#4a5568',
                    textStyle: { color: '#e2e8f0' },
                    formatter: function(params) {
                        let result = '';
                        params.forEach(param => {
                            if (param.seriesType === 'candlestick') {
                                result += `<strong>${param.axisValue}</strong><br/>`;
                                result += `开盘: ${param.data[0]}<br/>`;
                                result += `收盘: ${param.data[1]}<br/>`;
                                result += `最低: ${param.data[2]}<br/>`;
                                result += `最高: ${param.data[3]}<br/>`;
                            } else if (param.seriesType === 'bar') {
                                result += `成交量: ${param.data}<br/>`;
                            }
                        });

                        // Check for annotations at this point
                        const idx = dates.indexOf(params[0].axisValue);
                        if (idx >= 0 && data.annotations) {
                            const ts = data.bars[idx].timestamp;
                            const relatedAnnotations = data.annotations.filter(a => a.timestamp === ts);
                            relatedAnnotations.forEach(a => {
                                if (a.data.label) {
                                    result += `<br/><span style="color:${a.data.color || '#fff'}">${a.data.label}</span>`;
                                }
                            });
                        }

                        return result;
                    }
                },
                legend: { show: false },
                grid: [
                    { left: '10%', right: '8%', top: '10%', height: '55%' },
                    { left: '10%', right: '8%', top: '75%', height: '15%' }
                ],
                xAxis: [
                    { type: 'category', data: dates, gridIndex: 0, axisLine: { lineStyle: { color: '#4a5568' } }, axisLabel: { color: '#718096', show: false }, splitLine: { show: false } },
                    { type: 'category', data: dates, gridIndex: 1, axisLine: { lineStyle: { color: '#4a5568' } }, axisLabel: { color: '#718096', fontSize: 11 }, splitLine: { show: false } }
                ],
                yAxis: [
                    { scale: true, gridIndex: 0, axisLine: { lineStyle: { color: '#4a5568' } }, axisLabel: { color: '#718096' }, splitLine: { lineStyle: { color: '#2d3748', type: 'dashed' } } },
                    { scale: true, gridIndex: 1, axisLine: { lineStyle: { color: '#4a5568' } }, axisLabel: { color: '#718096' }, splitLine: { show: false } }
                ],
                dataZoom: isZoomEnabled ? [
                    { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
                    { type: 'slider', xAxisIndex: [0, 1], start: 0, end: 100 }
                ] : [
                    { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 }
                ],
                series: [
                    {
                        name: 'K线',
                        type: 'candlestick',
                        data: klineData,
                        xAxisIndex: 0,
                        yAxisIndex: 0,
                        itemStyle: {
                            color: '#48bb78',
                            color0: '#fc8181',
                            borderColor: '#48bb78',
                            borderColor0: '#fc8181'
                        },
                        markPoint: {
                            symbol: 'pin',
                            symbolSize: 30,
                            data: markPoints,
                            label: { color: '#fff', fontSize: 10 },
                            tooltip: { trigger: 'item', backgroundColor: '#1a1f36', borderColor: '#4a5568', textStyle: { color: '#e2e8f0' } }
                        },
                        markLine: {
                            symbol: ['none', 'none'],
                            data: markLines,
                            lineStyle: { width: 2 },
                            label: { show: true, position: 'end', color: '#fff', fontSize: 11 }
                        }
                    },
                    {
                        name: '成交量',
                        type: 'bar',
                        data: volumes,
                        xAxisIndex: 1,
                        yAxisIndex: 1,
                        itemStyle: { color: '#4a5568' }
                    }
                ]
            };

            if (chart) {
                chart.setOption(option, true);
            } else {
                chart = echarts.init(document.getElementById('kline-chart'));
                chart.setOption(option, true);
            }

            window.addEventListener('resize', () => {
                chart && chart.resize();
            });
        }

        // Render equity chart
        function renderEquityChart() {
            const data = getFilteredData();
            if (!data || !data.equity_curve || data.equity_curve.length === 0) return;

            const equityData = data.equity_curve.map(item => item.equity);
            const dates = data.equity_curve.map(item => new Date(item.timestamp).toLocaleString('zh-CN', {
                month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
            }));

            // Calculate drawdown
            const peaks = [];
            let peak = 0;
            equityData.forEach(v => {
                if (v > peak) peak = v;
                peaks.push(peak);
            });
            const drawdowns = equityData.map((v, i) => (v - peaks[i]) / peaks[i]);

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#1a1f36',
                    borderColor: '#4a5568',
                    textStyle: { color: '#e2e8f0' },
                    formatter: function(params) {
                        const equity = params.find(p => p.seriesName === '净值');
                        const dd = params.find(p => p.seriesName === '回撤');
                        if (equity) {
                            return `<strong>${equity.axisValue}</strong><br/>净值: ${equity.data.toLocaleString()}<br/>回撤: ${(dd.data * 100).toFixed(2)}%`;
                        }
                        return '';
                    }
                },
                legend: {
                    data: ['净值', '回撤'],
                    textStyle: { color: '#a0aec0' },
                    top: 0
                },
                grid: { left: '10%', right: '8%', top: '30%', bottom: '15%' },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLine: { lineStyle: { color: '#4a5568' } },
                    axisLabel: { color: '#718096', show: false },
                    splitLine: { show: false }
                },
                yAxis: [
                    {
                        scale: true,
                        position: 'left',
                        axisLine: { lineStyle: { color: '#4a5568' } },
                        axisLabel: { color: '#718096', formatter: v => v.toLocaleString() },
                        splitLine: { lineStyle: { color: '#2d3748', type: 'dashed' } }
                    },
                    {
                        scale: true,
                        position: 'right',
                        axisLine: { lineStyle: { color: '#4a5568' } },
                        axisLabel: { color: '#718096', formatter: v => (v * 100).toFixed(1) + '%' },
                        splitLine: { show: false }
                    }
                ],
                dataZoom: [
                    { type: 'inside', start: 0, end: 100 }
                ],
                series: [
                    {
                        name: '净值',
                        type: 'line',
                        data: equityData,
                        smooth: true,
                        lineStyle: { width: 2, color: '#60a5fa' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(96, 165, 250, 0.3)' },
                                { offset: 1, color: 'rgba(96, 165, 250, 0.05)' }
                            ])
                        },
                        symbol: 'none'
                    },
                    {
                        name: '回撤',
                        type: 'line',
                        data: drawdowns,
                        yAxisIndex: 1,
                        smooth: true,
                        lineStyle: { width: 1, color: '#fc8181' },
                        symbol: 'none'
                    }
                ]
            };

            if (equityChart) {
                equityChart.setOption(option, true);
            } else {
                equityChart = echarts.init(document.getElementById('equity-chart'));
                equityChart.setOption(option, true);
            }

            window.addEventListener('resize', () => {
                equityChart && equityChart.resize();
            });
        }

        // Annotation render map
        const renderMap = {
            buy_signal: (ctx, annotation, bars) => {
                const bar = findBarByTimestamp(bars, annotation.timestamp);
                if (bar) {
                    const idx = bars.indexOf(bar);
                    const color = annotation.data.color || '#48bb78';
                    ctx.markPoints.push({
                        coord: [idx, bar.close],
                        value: annotation.data.label || '买入',
                        symbol: 'triangle',
                        symbolSize: 14,
                        itemStyle: { color: color, borderColor: '#fff', borderWidth: 1 }
                    });
                }
            },

            sell_signal: (ctx, annotation, bars) => {
                const bar = findBarByTimestamp(bars, annotation.timestamp);
                if (bar) {
                    const idx = bars.indexOf(bar);
                    const color = annotation.data.color || '#fc8181';
                    ctx.markPoints.push({
                        coord: [idx, bar.close],
                        value: annotation.data.label || '卖出',
                        symbol: 'triangle',
                        symbolSize: 14,
                        symbolRotate: 180,
                        itemStyle: { color: color, borderColor: '#fff', borderWidth: 1 }
                    });
                }
            },

            neutral_signal: (ctx, annotation, bars) => {
                const bar = findBarByTimestamp(bars, annotation.timestamp);
                if (bar) {
                    const idx = bars.indexOf(bar);
                    ctx.markPoints.push({
                        coord: [idx, bar.close],
                        value: annotation.data.label || '中性',
                        symbol: 'diamond',
                        symbolSize: 12,
                        itemStyle: { color: '#a0aec0', borderColor: '#fff', borderWidth: 1 }
                    });
                }
            },

            horizontal_line: (ctx, annotation, bars) => {
                const startIdx = 0;
                const endIdx = bars.length - 1;
                const price = annotation.data.price;

                ctx.markLines.push({
                    yAxis: price,
                    lineStyle: {
                        color: annotation.data.color || '#60a5fa',
                        type: 'dashed',
                        width: 1
                    },
                    label: {
                        formatter: annotation.data.label || '',
                        position: 'end'
                    }
                });
            },

            trend_line: (ctx, annotation, bars) => {
                const startBar = findBarByTimestamp(bars, annotation.data.start?.timestamp || annotation.data.start);
                const endBar = findBarByTimestamp(bars, annotation.data.end?.timestamp || annotation.data.end);

                if (startBar && endBar) {
                    ctx.markLines.push({
                        coords: [
                            [bars.indexOf(startBar), startBar.close],
                            [bars.indexOf(endBar), endBar.close]
                        ],
                        lineStyle: {
                            color: annotation.data.color || '#ed8936',
                            width: 2
                        },
                        label: { formatter: annotation.data.label || '', position: 'middle' }
                    });
                }
            },

            pattern_mark: (ctx, annotation, bars) => {
                const points = annotation.data.points || [];
                const pattern = annotation.data.pattern;
                const color = annotation.data.color || PATTERN_COLORS[pattern] || '#9f7aea';
                const label = annotation.data.label || pattern;

                const coords = [];
                points.forEach(point => {
                    const bar = findBarByTimestamp(bars, point.timestamp || point);
                    if (bar) {
                        coords.push([bars.indexOf(bar), point.price || bar.close]);
                    }
                });

                if (coords.length >= 2) {
                    // Draw pattern line
                    ctx.markLines.push({
                        coords: coords,
                        lineStyle: {
                            color: color,
                            width: 2,
                            type: 'solid'
                        },
                        label: { formatter: label, position: 'middle', color: color }
                    });

                    // Draw neckline for head and shoulders patterns
                    if (annotation.data.neckline && coords.length >= 3) {
                        const necklineStart = findBarByTimestamp(bars, annotation.data.neckline.start || coords[0][0]);
                        const necklineEnd = findBarByTimestamp(bars, annotation.data.neckline.end || coords[coords.length - 1][0]);

                        if (necklineStart && necklineEnd) {
                            ctx.markLines.push({
                                coords: [
                                    [bars.indexOf(necklineStart), annotation.data.neckline.price],
                                    [bars.indexOf(necklineEnd), annotation.data.neckline.price]
                                ],
                                lineStyle: {
                                    color: color,
                                    width: 1,
                                    type: 'dashed'
                                }
                            });
                        }
                    }

                    // Draw point markers
                    coords.forEach((coord, idx) => {
                        const pointLabel = points[idx]?.label || '';
                        ctx.markPoints.push({
                            coord: coord,
                            value: pointLabel,
                            symbol: 'circle',
                            symbolSize: 8,
                            itemStyle: { color: color, borderColor: '#fff', borderWidth: 1 }
                        });
                    });
                }
            },

            support_zone: (ctx, annotation, bars) => {
                // Simplified: draw horizontal line
                ctx.markLines.push({
                    yAxis: annotation.data.price,
                    lineStyle: {
                        color: '#48bb78',
                        width: 2,
                        type: 'dashed'
                    },
                    label: { formatter: annotation.data.label || '支撑', position: 'end' }
                });
            },

            resistance_zone: (ctx, annotation, bars) => {
                ctx.markLines.push({
                    yAxis: annotation.data.price,
                    lineStyle: {
                        color: '#fc8181',
                        width: 2,
                        type: 'dashed'
                    },
                    label: { formatter: annotation.data.label || '阻力', position: 'end' }
                });
            },

            volume_spike: (ctx, annotation, bars) => {
                // Volume spikes handled in volume series, marking is visual cue
            },

            text_label: (ctx, annotation, bars) => {
                const bar = findBarByTimestamp(bars, annotation.timestamp);
                if (bar) {
                    const idx = bars.indexOf(bar);
                    ctx.markPoints.push({
                        coord: [idx, annotation.data.price || bar.close],
                        value: annotation.data.text || '',
                        symbol: 'none',
                        label: {
                            show: true,
                            formatter: annotation.data.text || '',
                            color: annotation.data.color || '#fff',
                            fontSize: 12,
                            backgroundColor: 'rgba(0,0,0,0.5)',
                            padding: [4, 8],
                            borderRadius: 4
                        }
                    });
                }
            },

            rectangle: (ctx, annotation, bars) => {
                // Simplified to markLine between points
                const startBar = findBarByTimestamp(bars, annotation.data.start);
                const endBar = findBarByTimestamp(bars, annotation.data.end);
                if (startBar && endBar) {
                    ctx.markLines.push({
                        coords: [
                            [bars.indexOf(startBar), startBar.close],
                            [bars.indexOf(endBar), endBar.close]
                        ],
                        lineStyle: {
                            color: annotation.data.color || '#f6ad55',
                            width: 2
                        }
                    });
                }
            },

            polygon: (ctx, annotation, bars) => {
                const points = annotation.data.points || [];
                const coords = [];
                points.forEach(point => {
                    const bar = findBarByTimestamp(bars, point);
                    if (bar) {
                        coords.push([bars.indexOf(bar), bar.close]);
                    }
                });
                if (coords.length >= 2) {
                    ctx.markLines.push({
                        coords: coords,
                        lineStyle: {
                            color: annotation.data.color || '#b794f4',
                            width: 2
                        },
                        label: { formatter: annotation.data.label || '', position: 'middle' }
                    });
                }
            }
        };

        // Find bar by timestamp (fuzzy match)
        function findBarByTimestamp(bars, timestamp) {
            if (!timestamp) return null;
            const targetTime = new Date(timestamp).getTime();

            // Try exact match first
            let bar = bars.find(b => new Date(b.timestamp).getTime() === targetTime);

            if (!bar) {
                // Find closest bar within 1 hour for intraday data
                bar = bars.find(b => Math.abs(new Date(b.timestamp) - targetTime) < 3600000);
            }

            return bar;
        }

        // Render trades table
        function renderTradesTable() {
            const data = getFilteredData();
            if (!data || !data.trades) {
                document.getElementById('trades-body').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#718096;">暂无交易记录</td></tr>';
                return;
            }

            const tbody = document.getElementById('trades-body');
            tbody.innerHTML = data.trades.map(trade => `
                <tr>
                    <td>${formatTimestamp(trade.timestamp)}</td>
                    <td><span class="side-badge ${trade.side.toLowerCase()}">${trade.side === 'BUY' ? '买入' : '卖出'}</span></td>
                    <td>${trade.price.toLocaleString()}</td>
                    <td>${trade.quantity}</td>
                    <td>${trade.commission.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        // Render pattern legend
        function renderPatternLegend() {
            const data = getFilteredData();
            if (!data || !data.annotations) {
                document.getElementById('pattern-legend').innerHTML = '';
                return;
            }

            const patterns = new Map();
            data.annotations.forEach(a => {
                if (a.type === 'pattern_mark' && a.data.pattern) {
                    patterns.set(a.data.pattern, a.data.label || a.data.pattern);
                }
            });

            if (patterns.size === 0) {
                document.getElementById('pattern-legend').innerHTML = '';
                return;
            }

            const legendHtml = Array.from(patterns.entries()).map(([pattern, label]) => `
                <div class="legend-item">
                    <div class="legend-line" style="background:${PATTERN_COLORS[pattern] || '#9f7aea'}"></div>
                    <span>${label}</span>
                </div>
            `).join('');

            document.getElementById('pattern-legend').innerHTML = legendHtml;
        }

        // Initialize date inputs
        function initDateInputs() {
            const { meta } = rawData;
            document.getElementById('start-date').value = meta.start || '';
            document.getElementById('end-date').value = meta.end || '';
        }

        // Apply date filter
        function applyDateFilter() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            filteredData = JSON.parse(JSON.stringify(rawData));

            if (startDate) {
                const start = new Date(startDate);
                filteredData.bars = filteredData.bars.filter(bar => new Date(bar.timestamp) >= start);
                filteredData.equity_curve = filteredData.equity_curve.filter(item => new Date(item.timestamp) >= start);
                filteredData.trades = filteredData.trades.filter(trade => new Date(trade.timestamp) >= start);
                filteredData.annotations = filteredData.annotations.filter(ann => new Date(ann.timestamp) >= start);
            }

            if (endDate) {
                const end = new Date(endDate);
                end.setHours(23, 59, 59);
                filteredData.bars = filteredData.bars.filter(bar => new Date(bar.timestamp) <= end);
                filteredData.equity_curve = filteredData.equity_curve.filter(item => new Date(item.timestamp) <= end);
                filteredData.trades = filteredData.trades.filter(trade => new Date(trade.timestamp) <= end);
                filteredData.annotations = filteredData.annotations.filter(ann => new Date(ann.timestamp) <= end);
            }

            renderKLineChart();
            renderEquityChart();
            renderTradesTable();
            renderPatternLegend();
        }

        // Toggle zoom
        function toggleZoom() {
            isZoomEnabled = !isZoomEnabled;
            const btn = document.getElementById('btn-zoom');
            btn.classList.toggle('active', isZoomEnabled);
            renderKLineChart();
        }

        // Reset zoom
        function resetZoom() {
            if (chart) {
                chart.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
            }
            if (equityChart) {
                equityChart.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
            }
        }

        // Toggle equity visibility
        function toggleEquity() {
            isEquityVisible = !isEquityVisible;
            const wrapper = document.getElementById('equity-chart').parentElement;
            wrapper.style.display = isEquityVisible ? 'block' : 'none';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
