# LLM 策略配置 - 本地部署模型
# 适用于 vLLM、Ollama 等本地部署的 LLM 服务

mode: llm

backtest:
  initial_capital: 100000
  commission_rate: 0.0003
  slippage: 0.001

strategy:
  name: LLMStrategy
  type: llm

data:
  symbol: ag
  freq: 1d
  start: "2024-01-01"
  end: "2024-12-31"
  data_dir: ./data

llm:
  provider: openai  # 使用 OpenAI 兼容接口
  api_key: dummy  # 本地部署无需真实 key
  base_url: "http://localhost:8080/v1"  # 本地 LLM 服务端点
  model: Qwen/Qwen2.5-7B-Instruct  # 本地模型名称
  temperature: 0.3

  # Prompt 配置
  rules: |
    支撑位买入，阻力位卖出
    趋势确认后跟进

  examples: 2

  cache_enabled: true
  cache_dir: ./cache

output_dir: ./runs