# LLM 策略配置 - 测试用
# 使用本地 LLM 服务

mode: llm

backtest:
  initial_capital: 100000
  commission_rate: 0.0003
  slippage: 0.001

strategy:
  name: LLMStrategy
  type: llm

data:
  symbol: sc
  freq: 1d
  start: "2025-01-01"
  end: "2025-06-30"

llm:
  provider: openai
  api_key: dummy
  base_url: "http://localhost:8199/v1"
  model: taiji
  temperature: 0.1
  disable_thinking: true
  max_tokens: 4096
  cache_enabled: false
  evolved_rules_path: "configs/strategies/llm_evolved_rules.txt"
  walk_forward: true

output_dir: ./runs