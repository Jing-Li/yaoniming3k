# LLM 策略配置 - 测试用
# 使用本地 LLM 服务

mode: llm

backtest:
  initial_capital: 100000
  commission_rate: 0.0003
  slippage: 0.001

strategy:
  name: LLMStrategy
  type: llm

data:
  symbol: ag
  freq: 1d
  start: "2024-01-01"
  end: "2024-01-10"
  data_dir: /home/user/data

llm:
  provider: openai
  api_key: dummy
  base_url: "http://localhost:8080/v1"
  model: taiji
  temperature: 0.3
  rules: |
    支撑位买入，阻力位卖出
    趋势确认后跟进
  examples: 1
  cache_enabled: false

output_dir: ./runs