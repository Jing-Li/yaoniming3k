# LLM 策略配置 - 本地部署模型
# 适用于 vLLM、Ollama 等本地部署的 LLM 服务

mode: llm

backtest:
  initial_capital: 100000
  commission_rate: 0.0003
  slippage: 0.001

strategy:
  name: LLMStrategy
  type: llm

data:
  symbol: ag
  freq: 1d
  start: "2024-01-01"
  end: "2024-12-31"
  data_dir: ./data

llm:
  provider: openai  # 使用 OpenAI 兼容接口
  api_key: dummy  # 本地部署无需真实 key
  base_url: "http://localhost:8080/v1"  # 本地 LLM 服务端点
  model: taiji  # 本地模型名称
  temperature: 0.1
  disable_thinking: true  # 禁用推理模型的 <think> 输出，避免截断
  max_tokens: 2048  # 推理模型内部 token 消耗大，需显式指定避免 JSON 截断

  # Prompt 使用蔡森专用模板（caisen_pattern.py），无需在此重复规则

  cache_enabled: true
  cache_dir: ./cache

output_dir: ./runs