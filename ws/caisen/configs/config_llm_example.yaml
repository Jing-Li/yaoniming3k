# LLM 策略配置示例
# 基于离线预计算架构：一次性分析历史数据，结果缓存后逐帧回放

mode: llm  # 使用 LLM 策略

backtest:
  initial_capital: 100000  # 初始资金
  commission_rate: 0.0003  # 手续费率
  slippage: 0.001  # 滑点

strategy:
  name: LLMStrategy
  type: llm  # code 或 llm

data:
  symbol: ag  # 品种
  freq: 1d  # 日线
  start: "2024-01-01"
  end: "2024-12-31"
  data_dir: ./data

llm:
  provider: openai  # openai / anthropic / 本地模型
  api_key: ${OPENAI_API_KEY}  # 支持环境变量
  model: gpt-4o  # 模型名称
  temperature: 0.3  # 温度参数（0-1，越高越随机）

  # Prompt 配置
  rules: |
    支撑位买入，阻力位卖出
    趋势确认后跟进
    严格执行止损

  examples: 2  # Few-shot 示例数量

  # 缓存配置
  cache_enabled: true
  cache_dir: ./cache

output_dir: ./runs